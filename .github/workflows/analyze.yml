name: analyze

on:
  workflow_dispatch:
    inputs:
      url:
        description: YouTube URL
        required: true
        type: string
      force:
        description: Re-analyze even if already in index
        type: boolean
        default: false
      low_res:
        description: Low media resolution (fewer tokens)
        type: boolean
        default: false
      model:
        description: Gemini model id (blank = YTA_MODEL variable or built-in default)
        type: string
        default: ""
  repository_dispatch:
    types: [analyze]

permissions:
  contents: write

# One analysis at a time so commits to index.jsonl never race.
concurrency:
  group: analyze
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install .

      # Inputs are passed via env (never interpolated into the script) so a
      # crafted URL/payload cannot inject shell. The CLI also re-validates the
      # URL and only ever sends a canonical watch URL to Gemini.
      - name: Analyze
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YTA_MODEL: ${{ inputs.model || vars.YTA_MODEL }}
          URL: ${{ github.event.inputs.url || github.event.client_payload.url }}
          FORCE: ${{ github.event.inputs.force || github.event.client_payload.force }}
          LOW_RES: ${{ github.event.inputs.low_res || github.event.client_payload.low_res }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY secret is not set (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          if [ -z "$URL" ]; then
            echo "::error::no url given (workflow input 'url' or client_payload.url)"
            exit 1
          fi
          args=()
          [ "$FORCE" = "true" ] && args+=(--force)
          [ "$LOW_RES" = "true" ] && args+=(--low-res)
          yta analyze "$URL" "${args[@]}" | tee "$RUNNER_TEMP/yta.out"
          {
            echo "### yta analyze"
            echo '```'
            cat "$RUNNER_TEMP/yta.out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit outputs
        env:
          URL: ${{ github.event.inputs.url || github.event.client_payload.url }}
        run: |
          git add videos index.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing to commit (already analyzed?)"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "analyze: $(git diff --cached --name-only --diff-filter=A -- videos | head -1 | cut -d/ -f2)" -m "source: $URL"
          for i in 1 2 3 4; do
            git push && exit 0
            git pull --rebase
            sleep $((2 ** i))
          done
          exit 1
