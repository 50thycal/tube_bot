[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-analyzer"
version = "0.1.0"
description = "Structured, schema-validated extraction of YouTube videos via the Gemini API."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # 2.22+: Interactions API. <3: 3.0 replaced httpx with httpx2 (our transport-error
    # handling and tests use httpx) and is untested here; upgrade deliberately.
    "google-genai>=2.22,<3",
    "httpx>=0.27",  # imported directly (transport errors); no longer implied by google-genai
    "pydantic>=2.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
yta = "youtube_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
